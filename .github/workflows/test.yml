name: Test

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
